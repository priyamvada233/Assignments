<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Learn Web Development</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #12203a;
        }

        /* Navbar: logo left, links and button right */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #30243f;
            color: #ffffff;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .btn {
            background: #c4a7e7;
            color: #30243f;
            border: 0;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    
        /* Hero banner */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-height: 280px;
            padding: 24px;
            text-align: center;
            background: #e9ddf7;
            color: #30243f;
        }

        .hero p {
            font-size: 16px;
        }

    </style>

</head>
<body>

    <nav>
        <h2>CodeLab</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <button class="btn">Sign up</button>
    </nav>

    <section class="hero">
        <h1>Turn Ideas Into Websites</h1>
        <p>Learn the basics, experiment with code, and build something of your own.</p>
        <button class="btn">Explore Courses</button>
    </section>
</body>
</html>
