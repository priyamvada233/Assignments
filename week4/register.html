<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the Coding Club.">
    <link rel="icon" href="final%20fav.ico" type="image/x-icon">
    <title>Register - Coding Club</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <h1>Coding Club Registration</h1>

    <form>
        <p>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </p>

        <p>
            <label for="date">Date of Birth:</label>
            <input type="date" id="date" name="date" required>
        </p>

        <p>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </p>

        <p>Year of Study:</p>
        <input type="radio" id="year1" name="year" value="1" required>
        <label for="year1">1st Year</label>

        <input type="radio" id="year2" name="year" value="2">
        <label for="year2">2nd Year</label>

        <input type="radio" id="year3" name="year" value="3">
        <label for="year3">3rd Year</label>

        <input type="radio" id="year4" name="year" value="4">
        <label for="year4">4th Year</label>

        <p>Areas of Interest:</p>
        <input type="checkbox" id="web" name="interest" value="Web Development">
        <label for="web">Web Development</label>

        <input type="checkbox" id="ai" name="interest" value="AI">
        <label for="ai">Artificial Intelligence</label>

        <input type="checkbox" id="app" name="interest" value="App Development">
        <label for="app">App Development</label>

        <p>
            <label for="course">Preferred Workshop:</label>
            <select id="course" name="course" required>
                <option value="">-- Select a Workshop --</option>
                <option value="web">Web Development</option>
                <option value="ai">Artificial Intelligence</option>
                <option value="app">App Development</option>
            </select>
        </p>

        <p>
            <label for="message">Why do you want to join the club?</label><br>
            <textarea id="message" name="message" rows="4" cols="40"></textarea>
        </p>

        <button type="submit">Register</button>
    </form>
</body>
</html>
